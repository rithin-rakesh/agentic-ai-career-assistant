version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_agent_app
    restart: always
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql://jobuser:jobpassword@postgres:5432/jobdb}
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://qdrant:6333}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - EMAIL_MODE=${EMAIL_MODE:-SMTP}
      - MOCK_COLLECTOR=${MOCK_COLLECTOR:-False}
      - MOCK_LLM=${MOCK_LLM:-False}
      - USE_CELERY=${USE_CELERY:-True}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production_32bytes_min}
      - JWT_SECRET=${JWT_SECRET:-agentic-ai-job-search-secret-2026}
      - SESSION_SECRET=${SESSION_SECRET:-dev_session_secret_key_32bytes_min}
      - COOKIE_SECURE=${COOKIE_SECURE:-False}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:8000","http://localhost","http://127.0.0.1:8000","http://127.0.0.1"]}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      - SCHEDULER_INTERVAL_MINUTES=${SCHEDULER_INTERVAL_MINUTES:-60}
      - AUTO_APPROVE_THRESHOLD=${AUTO_APPROVE_THRESHOLD:-80.0}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_agent_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info
    healthcheck:
      disable: true
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql://jobuser:jobpassword@postgres:5432/jobdb}
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://qdrant:6333}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - EMAIL_MODE=${EMAIL_MODE:-SMTP}
      - MOCK_COLLECTOR=${MOCK_COLLECTOR:-False}
      - MOCK_LLM=${MOCK_LLM:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production_32bytes_min}
      - JWT_SECRET=${JWT_SECRET:-agentic-ai-job-search-secret-2026}
      - SESSION_SECRET=${SESSION_SECRET:-dev_session_secret_key_32bytes_min}
      - COOKIE_SECURE=${COOKIE_SECURE:-False}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: job_agent_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpassword}
      POSTGRES_DB: ${POSTGRES_DB:-jobdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobuser} -d ${POSTGRES_DB:-jobdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: job_agent_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: job_agent_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh -c 'cat /proc/net/tcp | grep -q 18BD' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: job_agent_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: job_agent_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.0.0
    container_name: job_agent_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
